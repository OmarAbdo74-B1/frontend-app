<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BUTCHER CARS | Elite Performance Showroom</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0b0f19; color: #f3f4f6; overflow-x: hidden; }
        
        /* Navbar */
        nav { display: flex; justify-content: space-between; align-items: center; padding: 1.5rem 5%; background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(10px); border-bottom: 1px solid #1e293b; position: sticky; top: 0; z-index: 100; }
        .logo { font-size: 1.6rem; font-weight: 800; letter-spacing: 2px; color: #e11d48; text-transform: uppercase; }
        .logo span { color: #f8fafc; }
        .env-tag { background: #1e293b; border: 1px solid #334155; padding: 0.4rem 0.9rem; border-radius: 20px; font-size: 0.85rem; color: #38bdf8; }

        /* Hero Section */
        .hero { text-align: center; padding: 4rem 1rem 2rem; background: radial-gradient(circle at top, #1e1b4b 0%, #0b0f19 70%); }
        .hero h1 { font-size: 3rem; font-weight: 900; margin-bottom: 0.8rem; background: linear-gradient(to right, #f8fafc, #94a3b8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .hero p { color: #94a3b8; font-size: 1.1rem; max-width: 600px; margin: 0 auto 1.5rem; }
        .live-badge { display: inline-flex; align-items: center; gap: 8px; background: rgba(16, 185, 129, 0.1); color: #10b981; border: 1px solid rgba(16, 185, 129, 0.3); padding: 0.4rem 1rem; border-radius: 50px; font-size: 0.85rem; }
        .pulse-dot { width: 8px; height: 8px; background: #10b981; border-radius: 50%; animation: pulse 1.5s infinite; }
        
        @keyframes pulse { 0% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(1.3); } 100% { opacity: 1; transform: scale(1); } }

        /* Cars Grid */
        .container { max-width: 1200px; margin: 2rem auto; padding: 0 1.5rem; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 2rem; }
        .car-card { background: #131c2e; border: 1px solid #1e293b; border-radius: 16px; overflow: hidden; transition: transform 0.3s ease, border-color 0.3s ease; display: flex; flex-direction: column; }
        .car-card:hover { transform: translateY(-7px); border-color: #e11d48; box-shadow: 0 12px 30px rgba(225, 29, 72, 0.15); }
        .car-img { width: 100%; height: 210px; object-fit: cover; }
        .car-info { padding: 1.5rem; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .car-title { font-size: 1.3rem; font-weight: 700; color: #f8fafc; margin-bottom: 0.3rem; }
        .car-cat { color: #e11d48; font-size: 0.85rem; text-transform: uppercase; font-weight: 600; margin-bottom: 1rem; }
        .specs { display: flex; justify-content: space-between; background: #0b0f19; padding: 0.75rem 1rem; border-radius: 8px; margin-bottom: 1.2rem; border: 1px solid #1e293b; }
        .spec-item { font-size: 0.85rem; color: #94a3b8; }
        .spec-item b { color: #f8fafc; display: block; font-size: 0.95rem; margin-top: 2px; }
        .card-bottom { display: flex; justify-content: space-between; align-items: center; }
        .price { font-size: 1.3rem; font-weight: 800; color: #38bdf8; }
        .btn-order { background: #e11d48; color: white; border: none; padding: 0.6rem 1.2rem; border-radius: 8px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .btn-order:hover { background: #be123c; }

        /* Footer */
        footer { text-align: center; padding: 2.5rem; background: #080b12; border-top: 1px solid #1e293b; margin-top: 4rem; color: #64748b; font-size: 0.9rem; }
    </style>
</head>
<body>

    <nav>
        <div class="logo"><i class="fa-solid fa-gauge-high"></i> BUTCHER <span>CARS</span></div>
        <div class="env-tag" id="cluster-info"><i class="fa-solid fa-server"></i> Connecting to cluster...</div>
    </nav>

    <div class="hero">
        <div class="live-badge"><div class="pulse-dot"></div> Microservices Engine Connected</div>
        <h1>THE HIGH-PERFORMANCE FLEET</h1>
        <p>Explore high-end hypercars and track editions deployed seamlessly via GitOps & ArgoCD.</p>
    </div>

    <div class="container">
        <div class="grid" id="cars-container">
            <!-- Cars loaded dynamically from backend API -->
        </div>
    </div>

    <footer>
        <p>Enterprise GitOps Infrastructure | Butcher Cars Architecture</p>
    </footer>

    <script>
        async function loadCars() {
            const container = document.getElementById('cars-container');
            const clusterInfo = document.getElementById('cluster-info');
            try {
                const response = await fetch('/api/cars');
                const data = await response.json();
                
                clusterInfo.innerHTML = `<i class="fa-solid fa-circle-check" style="color:#10b981;"></i> Pod: <b>${data.clusterNode}</b> | Env: <b>${data.environment}</b>`;
                
                container.innerHTML = data.cars.map(car => `
                    <div class="car-card">
                        <img src="${car.image}" alt="${car.name}" class="car-img">
                        <div class="car-info">
                            <div>
                                <div class="car-cat">${car.category}</div>
                                <div class="car-title">${car.name}</div>
                            </div>
                            <div>
                                <div class="specs">
                                    <div class="spec-item">Power <b>${car.horsepower}</b></div>
                                    <div class="spec-item">Top Speed <b>${car.topSpeed}</b></div>
                                </div>
                                <div class="card-bottom">
                                    <div class="price">${car.price}</div>
                                    <button class="btn-order">Inquire Now</button>
                                </div>
                            </div>
                        </div>
                    </div>
                `).join('');
            } catch (err) {
                container.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: #ef4444; padding: 3rem;">
                    <h2><i class="fa-solid fa-triangle-exclamation"></i> Backend API Connection Failed</h2>
                    <p style="color:#94a3b8; margin-top: 0.5rem;">Verify backend service endpoint routing in K8s.</p>
                </div>`;
            }
        }
        loadCars();
    </script>
</body>
</html>
